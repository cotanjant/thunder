[package]
name = "thunder"
version = "1.0.1"
edition = "2024"
description = "A small FL Studio-style DAW in Rust"
authors = ["Thunder contributors"]
license = "MIT"
repository = "https://github.com/cotanjant/thunder"
homepage = "https://cotanjant.github.io/thunder/"

[package.metadata.wix]
upgrade-guid = "9B538FC9-5CB1-4E8A-84BD-695D60CEB5E7"
path-guid = "42412B8A-3916-4C6A-ACB7-0F30D645728D"
license = false
eula = false

[dependencies]
cpal = "0.18"
eframe = "0.37"
egui = "0.36"
fundsp = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
dirs = "6"
rtrb = "0.3"
midir = "0.11"
egui_dock = "0.21"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flacenc = { version = "0.5", default-features = false }
rusty_mp3 = "1"
oxideav-vorbis = "0.0.13"
oxideav-ogg = "0.1"
clack-host = { version = "0.2", features = ["libloading"] }
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "note-ports", "params", "state", "latency", "gui", "raw-window-handle_06"] }
raw-window-handle = "0.6"

[dev-dependencies]
egui_kittest = "0.36"
clap-sys = "0.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev.package.oxideav-vorbis]
opt-level = 2

[profile.dev.package.flacenc]
opt-level = 2

[profile.dev.package.rusty_mp3]
opt-level = 2

[profile.dev.package.fundsp]
opt-level = 2

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
allow-dirty = ["msi"]
rust-version = "1.99.0"
ci = ["github"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
installers = ["shell", "powershell", "msi", "homebrew"]
install-success-msg = "Thunder is installed! Run it with: thunder"
tap = "cotanjant/homebrew-tap"
include = ["assets/thunder.desktop", "assets/icon.svg"]
publish-jobs = ["homebrew"]

[workspace.metadata.dist.dependencies.apt]
libasound2-dev = "*"
libx11-dev = "*"
libxcb1-dev = "*"
libxext-dev = "*"
libxrandr-dev = "*"
libxi-dev = "*"
libxcursor-dev = "*"
libxinerama-dev = "*"
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libegl-dev = "*"
libgl-dev = "*"
libdbus-1-dev = "*"

[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
